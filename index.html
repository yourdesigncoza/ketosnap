<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeefea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KetoSnap</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="back-btn" class="icon-btn" hidden aria-label="Back to history">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <span class="spacer"></span>
  <button id="menu-btn" class="icon-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <span>Today</span>
  </button>
  <button data-tab="week">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Week</span>
  </button>
  <button id="snap-btn" class="snap" aria-label="Snap a meal">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </button>
  <button data-tab="shop">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
    <span>Shopping</span>
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span>History</span>
  </button>
</nav>

<input id="photo-file" type="file" accept="image/*" capture="environment" hidden>
<input id="import-file" type="file" accept="application/json" hidden>

<div id="toast" class="toast" role="status" popover="manual"></div>

<dialog id="entry" class="entry">
  <div id="entry-body"></div>
</dialog>

<dialog id="menu" class="menu">
  <button data-action="settings">Settings</button>
  <button data-action="export">Export backup</button>
  <button data-action="import">Import backup</button>
  <button data-action="install" id="install-item" hidden>Install app</button>
  <button data-action="close" class="muted">Close</button>
</dialog>

<dialog id="settings" class="panel">
  <h2>Settings</h2>
  <form id="signin-form">
    <label class="field">
      <span>Email</span>
      <input id="set-email" type="email" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Password</span>
      <span class="pw">
        <input id="set-password" type="password" autocomplete="current-password" required>
        <button type="button" id="pw-eye" class="eye" aria-label="Show password" aria-pressed="false">
          <svg class="eye-show" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-hide" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.7 3.4M6.6 6.6C4 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.9 0 3.6-.6 5-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>
        </button>
      </span>
    </label>
    <p id="signin-error" class="form-error" role="alert" hidden></p>
    <p class="hint">Signing in checks your meals and backs them up with their photos. Meals you snap before that are kept and checked once you are in.</p>
    <div class="row">
      <button type="submit" class="pill-btn">Sign in</button>
    </div>
  </form>
  <div id="account" hidden>
    <p class="hint">Signed in as <b id="set-user"></b>. Your meals and photos are backed up.</p>
    <div class="row">
      <button id="signout-btn" class="link-btn">Sign out</button>
    </div>
  </div>
  <div class="version">
    <span>Version <b id="set-version"></b></span>
    <button id="update-btn" class="link-btn">Check for update</button>
  </div>
  <div class="row">
    <button id="settings-close" class="pill-btn soft">Close</button>
  </div>
</dialog>

<script src="version.js"></script>
<script src="plan.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
